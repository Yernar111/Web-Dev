<h2>Albums:</h2>

<div *ngFor="let album of albums">
  <a [routerLink]="['/albums', album.id]">Album ID: {{ album.id }} Album title: {{ album.title }}</a>
  <button (click)="deleteAlbum(album.id)">Delete</button>
</div>
